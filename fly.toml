# The Catch server: wss://catch-g2.fly.dev, the one origin in apps/lens/app.json.
# Secrets (DEEPGRAM_API_KEY, GEMINI_API_KEY, CATCH_AUDIO_TOKEN, and the optional CATCH_WEARER_NAME, the
# wearer's name, never caught) are staged with `fly secrets set`;
# none is in this file or the repository. Deploy: `fly deploy` from catch/.
app = 'catch-g2'
primary_region = 'lax'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  CATCH_DB = '/data/catch.db'
  CATCH_SPLIT = 'loudness'

[mounts]
  source = 'catch_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  # One open WebSocket all weekend: keep one machine up, never scale to zero.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
